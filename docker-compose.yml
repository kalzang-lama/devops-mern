services:
  backend:
    build: ./server
    image: backend
    container_name: server
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    image: frontend
    container_name: client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend